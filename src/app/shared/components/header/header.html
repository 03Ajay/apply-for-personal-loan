<!-- header.html -->
<nav class="navbar w-100">
    <div class="header-display">
        <div class="container-fluid">
            @if (!isMobile) {
            <div class="d-flex hide-on-mobile">
                <img fetchpriority="high" [src]="imageUrl" alt="Bajaj Markets Logo" height="36"
                    class="loader-img header-company-logo" (error)="imageUrl = 'assets/images/fallback-logo.png'" />
            </div>
            }

            <div class="text-white display-center">
                @if (isBackButtonVisible) {
                <span class="back-arrow arrow ms-2" (click)="onBackArrowClickFn()"></span>
                }

                @if (!isMobile) {
                <div class="partition hide-on-mobile"></div>
                }

                <div class="main-header-text">
                    {{ headerText }}
                </div>
            </div>
        </div>

        <!-- RIGHT SECTION -->
        <div class="d-flex justify-content-end right-gap">
            @if (isInfoIconVisible) {
            <div class="page-info-icon" (click)="onPageInfoClickFn()">
                <img src="assets/images/png/page-info.png" height="24" width="24" alt="info" />
            </div>
            }
